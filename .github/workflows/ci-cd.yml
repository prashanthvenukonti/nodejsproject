name: My CI-CD Pipeline

on: 
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 175157388210.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: devops-node-app
  EKS_CLUSTER: practice-eks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Save Build output
        uses: actions/upload-artifact@v4

        with:
          name: build-output
          path: |
            dist/
            coverage/lcov.info
          retention-days: 7
  sonar:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
           SONAR_HOST_URL: https://sonarcloud.io
      
  docker:
    runs-on: ubuntu-latest
    needs: [build,sonar]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Docker Build
        run: docker build -t nodeapp:v1 .
      - name: Show the Image
        run: docker images nodeapp

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ env.AWS_REGION }}
      - name: Login To AWS working-directory
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY
      - name: Tag and Push the Image to ECR
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY

          docker tag nodeapp:v1 $IMAGE:latest

          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [docker,sonar]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ env.AWS_REGION }}
      - name: Connect using kubectl to EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER
      - name: Deploy to EKS
        run: kubectl apply -f k8s/nodeapp-deployment.yaml

      - name: Show Pods and app URL
        run: |
          kubectl get pods -l app=devops-node-app -o wide
          kubectl get svc devops-node-app
          HOST=$(kubectl get svc devops-node-app -o jsonpath='{.status.loadbalancer.ingress[0].hostname}')
          echo "App URL: http://$HOST"
        
      



    
    

